  description: >-
    Permission sets are the main components of [IAM rules](https://www.scaleway.com/en/docs/iam/concepts/#rule).
    They consist of sets of one or multiple [permissions](https://www.scaleway.com/en/docs/iam/concepts/#permission).


    Permission set names contain descriptions that clearly explain their purpose. For example, a permission
    set that grants access to all actions you can perform on Instances is called:\ `InstancesFullAccess`.


    Permissions sets (eg.`InstanceReadAccess`) and their [scope](https://www.scaleway.com/en/docs/iam/concepts/#scope)
    (eg. "on Project A only") make up IAM rules, which define the access rights that a [principal](https://www.scaleway.com/en/docs/iam/concepts/#principal)
