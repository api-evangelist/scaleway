- aid: scaleway:scaleway-applications-api
  name: Scaleway Applications API
  description: >-
    An application (also known as an IAM application) is a non-human user in a Scaleway Organization.
    IAM applications may be used when you want to create an API key that is not linked to a user, to give
    programmatic access to resources.


    Note that applications cannot, by definition, have access to the Scaleway console, as they have only
    an API key and no account themselves (they are not [accounts](https://www.scaleway.com/en/docs/iam/concepts/#account)).
  humanURL: https://www.scaleway.com/en/developers/api/instances/
