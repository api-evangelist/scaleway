- aid: scaleway:scaleway-api-keys-api
  name: Scaleway API Keys API
  description: >-
    An API key is a unique identifier, used to authenticate requests made to the Scaleway API. An API
    key consists of an access key and a secret key. The access key is like a unique ID or username, and
    not a sensitive piece of information. The secret key however is more sensitive, as it is like a password
    to authenticate the access key.


    Previously, an API key was associated with a single Scaleway [Project](https://www.scaleway.com/en/docs/iam/concepts/#api-key#project).
    The API key therefore had full read/write access to all resources on this Project, and only this Project.


    With IAM, an API key is now associated with an IAM [user](https://www.scaleway.com/en/docs/iam/concepts/#api-key#user)
    or [application](https://www.scaleway.com/en/docs/iam/concepts/#api-key#application). This allows
    fine-grained access to be defined for the IAM user bearing the API key across different Organizations,
    Projects, and resources.
  humanURL: https://www.scaleway.com/en/developers/api/instances/
  tags:
  - APIKeys
  tags_raw:
  - API Keys
