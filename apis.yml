- aid: scaleway:scaleway-ssh-keys-api
  name: Scaleway SSH Keys API
  description: >-
    An SSH Key (**S**ecure **Sh**ell Key) allows passwordless connection to an [Instance](https://www.scaleway.com/en/docs/instances/concepts/#instance).
    An SSH Key is [generated by creating an RSA key pair](https://www.scaleway.com/en/docs/console/my-project/how-to/create-ssh-key/),
    consisting of a sensitive **identification key**, (aka private key) which must be stored securely,
    and a **public key** which is uploaded to the Scaleway interface.


    The public key is kept in your Scaleway account and transferred to the Instance during the boot process,
    while the identification key is kept securely on your local computer. When connecting to the Instance
    via SSH, a trusted connection to the machine is established using the key pair.
