openapi: 3.2.0
info:
  title: Scaleway Triggers API
  version: '1.0'
  description: 'Operations tagged Triggers across 2 of this provider''s published API definitions: scaleway-serverless-containers-openapi.yml, scaleway-serverless-functions-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.scaleway.com
tags:
- name: Triggers
  description: 'A trigger is a way to invoke a container based on specific events, such as a periodic schedule or a message arriving in a queue.


    When the event occurs, the trigger invokes the container, passing relevant information about the event to it.'
paths:
  /containers/v1/regions/{region}/triggers:
    get:
      tags:
      - Triggers
      operationId: ListTriggers
      summary: List all triggers the caller can access (read permission)
      description: 'By default, the triggers listed are ordered by creation date in ascending order. This can be modified via the `order_by` field.


        Additional parameters can be set in the query to filter, such as `organization_id`, `project_id`, `namespace_id`, or `container_id`.'
      parameters:
      - in: path
        name: region
        description: The region you want to target
        required: true
        schema:
          type: string
          enum:
          - fr-par
          - nl-ams
          - pl-waw
      - in: query
        name: page
        schema:
          type: integer
          format: int32
      - in: query
        name: page_size
        schema:
          type: integer
          format: uint32
      - in: query
        name: order_by
        schema:
          $ref: '#/components/schemas/scaleway.containers.v1.ListTriggersRequest.OrderBy'
      - in: query
        name: organization_id
        schema:
          type: string
      - in: query
        name: project_id
        schema:
          type: string
      - in: query
        name: namespace_id
        schema:
          type: string
      - in: query
        name: container_id
        schema:
          type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/scaleway.containers.v1.ListTriggersResponse'
      security:
      - scaleway: []
      x-codeSamples:
      - lang: cURL
        source: "curl -X GET \\\n  -H \"X-Auth-Token: $SCW_SECRET_KEY\" \\\n  \"https://api.scaleway.com/containers/v1/regions/{region}/triggers\""
      - lang: HTTPie
        source: "http GET \"https://api.scaleway.com/containers/v1/regions/{region}/triggers\" \\\n  X-Auth-Token:$SCW_SECRET_KEY"
    post:
      tags:
      - Triggers
      operationId: CreateTrigger
      summary: Create a new trigger for the container with the specified ID
      parameters:
      - in: path
        name: region
        description: The region you want to target
        required: true
        schema:
          type: string
          enum:
          - fr-par
          - nl-ams
          - pl-waw
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/scaleway.containers.v1.Trigger'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                container_id:
                  type: string
                  description: ID of the container to trigger.
                name:
                  type: string
                  description: Name of the trigger.
                description:
                  type: string
                  description: Description of the trigger.
                tags:
                  type: array
                  description: Tags of the trigger.
                  items:
                    type: string
                destination_config:
                  type: object
                  description: Configuration of the destination to trigger.
                  properties:
                    http_path:
                      type: string
                      description: The HTTP path to send the request to (e.g., "/my-webhook-endpoint").
                    http_method:
                      type: string
                      description: The HTTP method to use when sending the request (e.g., get, post, put, patch, delete). Must be specified as lowercase.
                      enum:
                      - unknown_http_method
                      - get
                      - post
                      - put
                      - patch
                      - delete
                      default: unknown_http_method
                  required:
                  - http_path
                  - http_method
                  x-properties-order:
                  - http_path
                  - http_method
                cron_config:
                  type: object
                  description: Configuration for a cron source.
                  properties:
                    schedule:
                      type: string
                      description: UNIX cron schedule to run job (e.g., "* * * * *").
                    timezone:
                      type: string
                      description: Timezone for the cron schedule, in tz database format (e.g., "Europe/Paris").
                    body:
                      type: string
                      description: Body to send to the container when the trigger is invoked.
                    headers:
                      type: object
                      description: Additional headers to send to the container when the trigger is invoked.
                      properties:
                        <headerKey>:
                          type: string
                          description: Additional headers to send to the container when the trigger is invoked.
                      additionalProperties: true
                  nullable: true
                  required:
                  - schedule
                  - timezone
                  x-properties-order:
                  - schedule
                  - timezone
                  - body
                  - headers
                  x-one-of: source_config
                sqs_config:
                  type: object
                  description: Configuration for an SQS queue source.
                  properties:
                    region:
                      type: string
                      description: The region where the SQS queue is hosted (e.g., "fr-par", "nl-ams").
                    endpoint:
                      type: string
                      description: Endpoint URL to use to access SQS (e.g., "https://sqs.mnq.fr-par.scaleway.com").
                    access_key_id:
                      type: string
                      description: The access key for accessing the SQS queue.
                    secret_access_key:
                      type: string
                      description: The secret key for accessing the SQS queue.
                    queue_url:
                      type: string
                      description: The URL of the SQS queue to monitor for messages.
                  nullable: true
                  required:
                  - region
                  - endpoint
                  - access_key_id
                  - secret_access_key
                  - queue_url
                  x-properties-order:
                  - region
                  - endpoint
                  - access_key_id
                  - secret_access_key
                  - queue_url
                  x-one-of: source_config
                nats_config:
                  type: object
                  description: Configuration for a NATS source.
                  properties:
                    server_urls:
                      type: array
                      description: The URLs of the NATS server (e.g., "nats://nats.mnq.fr-par.scaleway.com:4222").
                      items:
                        type: string
                    subject:
                      type: string
                      description: NATS subject to subscribe to (e.g., "my-subject").
                    credentials_file_content:
                      type: string
                      description: 'The content of the NATS credentials file.

                        The credentials from this file will be used to authenticate with the NATS server and subscribe to the specified subject.'
                  nullable: true
                  required:
                  - server_urls
                  - subject
                  - credentials_file_content
                  x-properties-order:
                  - server_urls
                  - subject
                  - credentials_file_content
                  x-one-of: source_config
              required:
              - container_id
              - name
              x-properties-order:
              - container_id
              - name
              - description
              - tags
              - destination_config
              - cron_config
              - sqs_config
              - nats_config
      security:
      - scaleway: []
      x-codeSamples:
      - lang: cURL
        source: "curl -X POST \\\n  -H \"X-Auth-Token: $SCW_SECRET_KEY\" \\\n  -H \"Content-Type: application/json\" \\\n  -d '{\"container_id\":\"string\",\"name\":\"string\"}' \\\n  \"https://api.scaleway.com/containers/v1/regions/{region}/triggers\""
      - lang: HTTPie
        source: "http POST \"https://api.scaleway.com/containers/v1/regions/{region}/triggers\" \\\n  X-Auth-Token:$SCW_SECRET_KEY \\\n  container_id=\"string\" \\\n  name=\"string\""
    servers:
    - url: https://api.scaleway.com
  /containers/v1/regions/{region}/triggers/{trigger_id}:
