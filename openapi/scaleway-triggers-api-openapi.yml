      security:
      - scaleway: []
      x-codeSamples:
      - lang: cURL
        source: "curl -X GET \\\n  -H \"X-Auth-Token: $SCW_SECRET_KEY\" \\\n  \"https://api.scaleway.com/containers/v1/regions/{region}/triggers/{trigger_id}\""
      - lang: HTTPie
        source: "http GET \"https://api.scaleway.com/containers/v1/regions/{region}/triggers/{trigger_id}\" \\\n  X-Auth-Token:$SCW_SECRET_KEY"
    patch:
      tags:
      - Triggers
      operationId: UpdateTrigger
      summary: Update the trigger associated with the specified ID
      description: 'When updating a trigger, you cannot specify a different source type than the one already set.

        Only fields present in the request are updated; others are left untouched.'
      parameters:
      - in: path
        name: region
        description: The region you want to target
        required: true
        schema:
