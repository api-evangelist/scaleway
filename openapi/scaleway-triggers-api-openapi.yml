      x-codeSamples:
      - lang: cURL
        source: "curl -X DELETE \\\n  -H \"X-Auth-Token: $SCW_SECRET_KEY\" \\\n  \"https://api.scaleway.com/containers/v1/regions/{region}/triggers/{trigger_id}\""
      - lang: HTTPie
        source: "http DELETE \"https://api.scaleway.com/containers/v1/regions/{region}/triggers/{trigger_id}\" \\\n  X-Auth-Token:$SCW_SECRET_KEY"
    servers:
    - url: https://api.scaleway.com
  /functions/v1beta1/regions/{region}/triggers:
    get:
      tags:
      - Triggers
      operationId: ListTriggers
      summary: List all triggers
      description: List all triggers belonging to a specified Organization or Project.
      parameters:
      - in: path
        name: region
        description: The region you want to target
        required: true
        schema:
          type: string
          enum:
          - fr-par
          - nl-ams
          - pl-waw
      - in: query
        name: page
        description: Page number to return.
        schema:
          type: integer
          format: int32
      - in: query
        name: page_size
        description: Maximum number of triggers to return per page.
        schema:
          type: integer
          format: uint32
      - in: query
        name: order_by
        description: Order in which to return results.
        schema:
          type: string
          enum:
          - created_at_asc
          - created_at_desc
          x-enum-descriptions:
            values:
              created_at_asc: Order by creation date ascending
              created_at_desc: Order by creation date descending
          default: created_at_asc
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/scaleway.functions.v1beta1.ListTriggersResponse'
      security:
      - scaleway: []
      x-codeSamples:
      - lang: cURL
        source: "curl -X GET \\\n  -H \"X-Auth-Token: $SCW_SECRET_KEY\" \\\n  \"https://api.scaleway.com/functions/v1beta1/regions/{region}/triggers\""
      - lang: HTTPie
        source: "http GET \"https://api.scaleway.com/functions/v1beta1/regions/{region}/triggers\" \\\n  X-Auth-Token:$SCW_SECRET_KEY"
    post:
      tags:
      - Triggers
      operationId: CreateTrigger
      summary: Create a trigger
      description: Create a new trigger for a specified function.
      parameters:
      - in: path
        name: region
        description: The region you want to target
        required: true
        schema:
          type: string
          enum:
          - fr-par
          - nl-ams
          - pl-waw
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/scaleway.functions.v1beta1.Trigger'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: Name of the trigger.
                function_id:
                  type: string
                  description: ID of the function to trigger.
                description:
                  type: string
                  description: Description of the trigger.
                  nullable: true
                scw_sqs_config:
                  type: object
                  description: Configuration for a Scaleway Messaging and Queuing SQS queue.
                  properties:
                    queue:
                      type: string
                      description: Name of the SQS queue the trigger should listen to.
                    mnq_project_id:
                      type: string
                      description: 'ID of the Messaging and Queuing project.

                        You must have activated SQS on this project.'
                    mnq_region:
                      type: string
                      description: 'Region in which the Messaging and Queuing project is activated.

                        Currently, only the `fr-par` and `nl-ams` regions are available.'
                  nullable: true
                  required:
                  - queue
                  - mnq_project_id
                  - mnq_region
                  x-properties-order:
                  - queue
                  - mnq_project_id
                  - mnq_region
                  x-one-of: config
                scw_nats_config:
                  type: object
                  description: Configuration for a Scaleway Messaging and Queuing NATS subject.
                  properties:
                    subject:
                      type: string
                      description: Name of the NATS subject the trigger should listen to.
                    mnq_nats_account_id:
                      type: string
                      description: ID of the Messaging and Queuing NATS account.
                    mnq_project_id:
                      type: string
                      description: ID of the Messaging and Queuing project.
                    mnq_region:
                      type: string
                      description: 'Region in which the Messaging and Queuing project is activated.

                        Currently, only the `fr-par` and `nl-ams` regions are available.'
                  nullable: true
                  required:
                  - subject
                  - mnq_nats_account_id
                  - mnq_region
                  x-properties-order:
                  - subject
                  - mnq_nats_account_id
                  - mnq_project_id
                  - mnq_region
                  x-one-of: config
              required:
              - name
              - function_id
              x-properties-order:
              - name
              - function_id
              - description
              - scw_sqs_config
              - scw_nats_config
      security:
      - scaleway: []
      x-codeSamples:
      - lang: cURL
        source: "curl -X POST \\\n  -H \"X-Auth-Token: $SCW_SECRET_KEY\" \\\n  -H \"Content-Type: application/json\" \\\n  -d '{\"function_id\":\"string\",\"name\":\"string\"}' \\\n  \"https://api.scaleway.com/functions/v1beta1/regions/{region}/triggers\""
      - lang: HTTPie
        source: "http POST \"https://api.scaleway.com/functions/v1beta1/regions/{region}/triggers\" \\\n  X-Auth-Token:$SCW_SECRET_KEY \\\n  function_id=\"string\" \\\n  name=\"string\""
    servers:
    - url: https://api.scaleway.com
  /functions/v1beta1/regions/{region}/triggers/{trigger_id}:
    get:
      tags:
      - Triggers
      operationId: GetTrigger
      summary: Get a trigger
      description: Get a trigger with a specified ID.
