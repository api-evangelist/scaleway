openapi: 3.2.0
info:
  title: Serverless Containers API
  description: Scaleway Serverless Containers is a «Container As A Service» product which gives users the ability to deploy atomic serverless workloads and only pay for resources used while containers are running.
  version: v1
servers:
- url: https://api.scaleway.com
tags:
- name: Containers
  description: 'A container is a web application, packaged as an OCI image, that runs inside Scaleway infrastructure and scales automatically.


    A container can be composed of multiple instances, depending on the scaling option configured by the user.'
paths:
  /containers/v1/regions/{region}:
    get:
      operationId: GetServiceInfo
      parameters:
      - in: path
        name: region
        description: The region you want to target
        required: true
        schema:
          type: string
          enum:
          - fr-par
          - nl-ams
          - pl-waw
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/scaleway.std.ServiceInfo'
      security:
      - scaleway: []
      x-codeSamples:
      - lang: cURL
        source: "curl -X GET \\\n  -H \"X-Auth-Token: $SCW_SECRET_KEY\" \\\n  \"https://api.scaleway.com/containers/v1/regions/{region}\""
      - lang: HTTPie
        source: "http GET \"https://api.scaleway.com/containers/v1/regions/{region}\" \\\n  X-Auth-Token:$SCW_SECRET_KEY"
      tags:
      - Containers
      summary: Get service info
      x-summary-source: derived
  /containers/v1/regions/{region}/containers:
    get:
      tags:
      - Containers
      operationId: ListContainers
      summary: List all containers the caller can access (read permission)
      description: 'By default, the containers listed are ordered by creation date in ascending order. This can be modified via the `order_by` field.


        Additional parameters can be set in the query to filter, such as `organization_id`, `project_id`, and `name`.'
      parameters:
      - in: path
        name: region
        description: The region you want to target
        required: true
        schema:
          type: string
          enum:
          - fr-par
          - nl-ams
          - pl-waw
      - in: query
        name: page
        schema:
          type: integer
          format: int32
      - in: query
        name: page_size
        schema:
          type: integer
          format: uint32
      - in: query
        name: order_by
        schema:
          $ref: '#/components/schemas/scaleway.containers.v1.ListContainersRequest.OrderBy'
      - in: query
        name: organization_id
        schema:
          type: string
      - in: query
        name: project_id
        schema:
          type: string
      - in: query
        name: namespace_id
        schema:
          type: string
      - in: query
        name: name
        schema:
          type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/scaleway.containers.v1.ListContainersResponse'
      security:
      - scaleway: []
      x-codeSamples:
      - lang: cURL
        source: "curl -X GET \\\n  -H \"X-Auth-Token: $SCW_SECRET_KEY\" \\\n  \"https://api.scaleway.com/containers/v1/regions/{region}/containers\""
      - lang: HTTPie
        source: "http GET \"https://api.scaleway.com/containers/v1/regions/{region}/containers\" \\\n  X-Auth-Token:$SCW_SECRET_KEY"
    post:
      tags:
      - Containers
      operationId: CreateContainer
      summary: Create a new container in a namespace
      description: Name must be unique inside the given namespace.
      parameters:
      - in: path
        name: region
        description: The region you want to target
        required: true
        schema:
          type: string
          enum:
          - fr-par
          - nl-ams
          - pl-waw
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/scaleway.containers.v1.Container'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                namespace_id:
                  type: string
                  description: Unique ID of the namespace the container belongs to.
                name:
                  type: string
                  description: Container name.
                environment_variables:
                  type: object
                  description: Environment variables of the container.
                  properties:
                    <environment_variableKey>:
                      type: string
                      description: Environment variables of the container.
                  additionalProperties: true
                secret_environment_variables:
                  type: object
                  description: Secret environment variables of the container.
                  properties:
                    <secret_environment_variableKey>:
                      type: string
                      description: Secret environment variables of the container.
                  additionalProperties: true
                min_scale:
                  type: integer
                  description: Minimum number of instances to scale the container to.
                  format: uint32
                max_scale:
                  type: integer
                  description: Maximum number of instances to scale the container to.
                  format: uint32
                memory_limit_bytes:
                  type: integer
                  description: Memory limit of the container in bytes. (in bytes)
                  format: uint64
                mvcpu_limit:
                  type: integer
                  description: CPU limit of the container in mvCPU.
                  format: uint32
                timeout:
                  type: string
                  description: Processing time limit for the container. (in seconds)
                  example: 2.5s
                  nullable: true
                privacy:
                  type: string
                  description: Privacy policy of the container.
                  enum:
                  - unknown_privacy
                  - public
                  - private
                  x-enum-descriptions:
                    values:
                      unknown_privacy: Unknown privacy
                      public: Container is public, and can be accessed without authentication
                      private: Container is private, and can only be accessed by providing an authentication token (IAM or legacy JWTs)
                  default: unknown_privacy
                description:
                  type: string
                  description: Container description.
                image:
                  type: string
                  description: Image reference (e.g. "rg.fr-par.scw.cloud/my-registry-namespace/image:tag").
                protocol:
                  type: string
                  description: Protocol the container uses.
                  enum:
                  - unknown_protocol
                  - http1
                  - h2c
                  x-enum-descriptions:
                    values:
                      unknown_protocol: Unknown protocol
                      http1: HTTP/1 protocol. Recommended for most use cases
                      h2c: HTTP/2 protocol. Useful for gRPC applications. Requires that the container explicitly supports HTTP/2 (e.g. Nginx's `listen 80 http2` directive).
                  default: unknown_protocol
                port:
                  type: integer
                  description: Port the container listens on.
                  format: uint32
                https_connections_only:
                  type: boolean
                  description: If true, it will allow only HTTPS connections to access your container to prevent it from being triggered by insecure connections (HTTP).
                sandbox:
                  type: string
                  description: Execution environment of the container.
                  enum:
                  - unknown_sandbox
                  - v1
                  - v2
                  x-enum-descriptions:
                    values:
                      unknown_sandbox: Unknown sandbox
                      v1: Legacy sandbox with slower cold starts. Fully supports the Linux system call interface
                      v2: Recommended sandbox with faster cold starts
                  default: unknown_sandbox
                local_storage_limit_bytes:
                  type: integer
                  description: Local storage limit of the container (in bytes). (in bytes)
                  format: uint64
                scaling_option:
                  type: object
                  description: Parameter used to decide when to scale up or down.
                  properties:
                    concurrent_requests_threshold:
                      type: integer
                      description: Scale depending on the number of concurrent requests being processed per container instance. The threshold value is the number of concurrent requests above which the container will be scaled up.
                      format: uint32
                      nullable: true
                      x-one-of: scaling_rule
                    cpu_usage_threshold:
                      type: integer
                      description: Scale depending on the CPU usage of a container instance. The threshold value is the percentage of CPU usage above which the container will be scaled up.
                      format: uint32
                      nullable: true
                      x-one-of: scaling_rule
                    memory_usage_threshold:
                      type: integer
                      description: Scale depending on the memory usage of a container instance. The threshold value is the percentage of memory usage above which the container will be scaled up.
                      format: uint32
                      nullable: true
                      x-one-of: scaling_rule
                  x-properties-order:
                  - concurrent_requests_threshold
                  - cpu_usage_threshold
                  - memory_usage_threshold
                liveness_probe:
                  type: object
                  description: 'Defines how to check if the container is running and healthy.

                    If the liveness probe fails, the container will be restarted.

                    It is performed periodically during the container''s lifetime. The liveness probe is not executed until the startup probe (if defined) is successful.


                    Possible check types:

                    - http: Perform HTTP check on the container with the specified path.

                    - tcp: Perform TCP check on the container.'
                  properties:
                    failure_threshold:
                      type: integer
                      description: 'Number of consecutive failures before considering the container as unhealthy.

                        Unhealthy containers do not receive traffic from incoming requests.'
                      format: uint32
                    interval:
                      type: string
                      description: Time interval between checks. (in seconds)
                      example: 2.5s
                      nullable: true
                    timeout:
                      type: string
                      description: Duration before the check times out. (in seconds)
                      example: 2.5s
                      nullable: true
                    tcp:
                      type: object
                      description: 'Perform TCP check on the container.

                        The check is successful if a TCP connection can be established with the container within the specified timeout.'
                      nullable: true
                      x-one-of: probe
                    http:
                      type: object
                      description: 'Perform HTTP check on the container.

                        The check is successful if an HTTP request to the specified path returns a successful status code (e.g. 2XX or 3XX) within the specified timeout.'
                      properties:
                        path:
                          type: string
                          description: HTTP path to perform the check on.
                      nullable: true
                      x-properties-order:
                      - path
                      x-one-of: probe
                  x-properties-order:
                  - failure_threshold
                  - interval
                  - timeout
                  - tcp
                  - http
                startup_probe:
                  type: object
                  description: 'Defines how to check if the container has started successfully.

                    If the startup probe fails, the container will be restarted.

                    This check is useful for applications that might take a long time to start. It is only performed when the container is starting.


                    Possible check types:

                    - http: Perform HTTP check on the container with the specified path.

                    - tcp: Perform TCP check on the container.'
                  properties:
                    failure_threshold:
                      type: integer
                      description: 'Number of consecutive failures before considering the container as unhealthy.

                        Unhealthy containers do not receive traffic from incoming requests.'
                      format: uint32
                    interval:
                      type: string
                      description: Time interval between checks. (in seconds)
                      example: 2.5s
                      nullable: true
                    timeout:
                      type: string
                      description: Duration before the check times out. (in seconds)
                      example: 2.5s
                      nullable: true
                    tcp:
                      type: object
                      description: 'Perform TCP check on the container.

                        The check is successful if a TCP connection can be established with the container within the specified timeout.'
                      nullable: true
                      x-one-of: probe
                    http:
                      type: object
                      description: 'Perform HTTP check on the container.

                        The check is successful if an HTTP request to the specified path returns a successful status code (e.g. 2XX or 3XX) within the specified timeout.'
                      properties:
                        path:
                          type: string
                          description: HTTP path to perform the check on.
                      nullable: true
                      x-properties-order:
                      - path
                      x-one-of: probe
                  x-properties-order:
                  - failure_threshold
                  - interval
                  - timeout
                  - tcp
                  - http
                tags:
                  type: array
                  description: Tags of the Serverless Container.
                  items:
                    type: string
                private_network_id:
                  type: string
                  description: 'ID of the Private Network the container is connected to.

                    When connected to a Private Network, the container can access other Scaleway resources in this Private Network.'
                command:
                  type: array
                  description: 'Container command.

                    Command executed when the container starts. This overrides the default command defined in the container image. This is usually the main executable, or ENTRYPOINT script to run.'
                  items:
                    type: string
                args:
                  type: array
                  description: 'Container arguments.

                    Arguments passed to the command specified in the "command" field. These override the default arguments from the container image, and behave like command-line parameters.'
                  items:
                    type: string
              required:
              - namespace_id
              - name
              - image
              x-properties-order:
              - namespace_id
              - name
              - environment_variables
              - secret_environment_variables
              - min_scale
              - max_scale
              - memory_limit_bytes
              - mvcpu_limit
              - timeout
              - privacy
              - description
              - image
              - protocol
              - port
              - https_connections_only
              - sandbox
              - local_storage_limit_bytes
              - scaling_option
              - liveness_probe
              - startup_probe
              - tags
              - private_network_id
              - command
              - args
      security:
      - scaleway: []
      x-codeSamples:
      - lang: cURL
        source: "curl -X POST \\\n  -H \"X-Auth-Token: $SCW_SECRET_KEY\" \\\n  -H \"Content-Type: application/json\" \\\n  -d '{\n    \"environment_variables\": {\n        \"<environment_variableKey>\": \"string\"\n    },\n    \"image\": \"string\",\n    \"name\": \"string\",\n    \"namespace_id\": \"string\",\n    \"secret_environment_variables\": {\n        \"<secret_environment_variableKey>\": \"string\"\n    }\n  }' \\\n  \"https://api.scaleway.com/containers/v1/regions/{region}/containers\""
      - lang: HTTPie
        source: "http POST \"https://api.scaleway.com/containers/v1/regions/{region}/containers\" \\\n  X-Auth-Token:$SCW_SECRET_KEY \\\n  environment_variables:='{\n    \"<environment_variableKey>\": \"string\"\n  }' \\\n  image=\"string\" \\\n  name=\"string\" \\\n  namespace_id=\"string\" \\\n  secret_environment_variables:='{\n    \"<secret_environment_variableKey>\": \"string\"\n  }'"
  /containers/v1/regions/{region}/containers/{container_id}:
    get:
      tags:
      - Containers
      operationId: GetContainer
      summary: Get the container associated with the specified ID
      parameters:
      - in: path
        name: region
        description: The region you want to target
        required: true
        schema:
          type: string
          enum:
          - fr-par
          - nl-ams
          - pl-waw
      - in: path
        name: container_id
        required: true
        schema:
          type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/scaleway.containers.v1.Container'
      security:
      - scaleway: []
      x-codeSamples:
      - lang: cURL
        source: "curl -X GET \\\n  -H \"X-Auth-Token: $SCW_SECRET_KEY\" \\\n  \"https://api.scaleway.com/containers/v1/regions/{region}/containers/{container_id}\""
      - lang: HTTPie
        source: "http GET \"https://api.scaleway.com/containers/v1/regions/{region}/containers/{container_id}\" \\\n  X-Auth-Token:$SCW_SECRET_KEY"
    patch:
      tags:
      - Containers
      operationId: UpdateContainer
      summary: Update the container associated with the specified ID
      description: Only fields present in the request are updated; others are left untouched.
      parameters:
      - in: path
        name: region
        description: The region you want to target
        required: true
        schema:
          type: string
          enum:
          - fr-par
          - nl-ams
          - pl-waw
      - in: path
        name: container_id
        description: UUID of the container to update.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/scaleway.containers.v1.Container'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                environment_variables:
                  type: object
                  description: Environment variables of the container.
                  properties:
                    <key>:
                      type: string
                  nullable: true
                secret_environment_variables:
                  type: object
                  description: Secret environment variables of the container.
                  properties:
                    <key>:
                      type: string
                  nullable: true
                min_scale:
                  type: integer
                  description: Minimum number of instances to scale the container to.
                  format: uint32
                max_scale:
                  type: integer
                  description: Maximum number of instances to scale the container to.
                  format: uint32
                memory_limit_bytes:
                  type: integer
                  description: Memory limit of the container in bytes. (in bytes)
                  format: uint64
                mvcpu_limit:
                  type: integer
                  description: CPU limit of the container in mvCPU.
                  format: uint32
                timeout:
                  type: string
                  description: Processing time limit for the container. (in seconds)
                  example: 2.5s
                  nullable: true
                privacy:
                  type: string
                  description: Privacy policy of the container.
                  enum:
                  - unknown_privacy
                  - public
                  - private
                  x-enum-descriptions:
                    values:
                      unknown_privacy: Unknown privacy
                      public: Container is public, and can be accessed without authentication
                      private: Container is private, and can only be accessed by providing an authentication token (IAM or legacy JWTs)
                  default: unknown_privacy
                description:
                  type: string
                  description: Container description.
                image:
                  type: string
                  description: Image reference (e.g. "rg.fr-par.scw.cloud/my-registry-namespace/image:tag").
                protocol:
                  type: string
                  description: Protocol the container uses.
                  enum:
                  - unknown_protocol
                  - http1
                  - h2c
                  x-enum-descriptions:
                    values:
                      unknown_protocol: Unknown protocol
                      http1: HTTP/1 protocol. Recommended for most use cases
                      h2c: HTTP/2 protocol. Useful for gRPC applications. Requires that the container explicitly supports HTTP/2 (e.g. Nginx's `listen 80 http2` directive).
                  default: unknown_protocol
                port:
                  type: integer
                  description: Port the container listens on.
                  format: uint32
                https_connection_only:
                  type: boolean
                  description: If true, it will allow only HTTPS connections to access your container to prevent it from being triggered by insecure connections (HTTP).
                sandbox:
                  type: string
                  description: Execution environment of the container.
                  enum:
                  - unknown_sandbox
                  - v1
                  - v2
                  x-enum-descriptions:
                    values:
                      unknown_sandbox: Unknown sandbox
                      v1: Legacy sandbox with slower cold starts. Fully supports the Linux system call interface
                      v2: Recommended sandbox with faster cold starts
                  default: unknown_sandbox
                local_storage_limit_bytes:
                  type: integer
                  description: Local storage limit of the container (in bytes). (in bytes)
                  format: uint64
                scaling_option:
                  type: object
                  description: Parameter used to decide when to scale up or down.
                  properties:
                    concurrent_requests_threshold:
                      type: integer
                      description: Scale depending on the number of concurrent requests being processed per container instance. The threshold value is the number of concurrent requests above which the container will be scaled up.
                      format: uint32
                      nullable: true
                      x-one-of: scaling_rule
                    cpu_usage_threshold:
                      type: integer
                      description: Scale depending on the CPU usage of a container instance. The threshold value is the percentage of CPU usage above which the container will be scaled up.
                      format: uint32
                      nullable: true
                      x-one-of: scaling_rule
                    memory_usage_threshold:
                      type: integer
                      description: Scale depending on the memory usage of a container instance. The threshold value is the percentage of memory usage above which the container will be scaled up.
                      format: uint32
                      nullable: true
                      x-one-of: scaling_rule
                  x-properties-order:
                  - concurrent_requests_threshold
                  - cpu_usage_threshold
                  - memory_usage_threshold
                liveness_probe:
                  type: object
                  description: 'Defines how to check if the container is running and healthy.

                    If the liveness probe fails, the container will be restarted.

                    It is performed periodically during the container''s lifetime. The liveness probe is not executed until the startup probe (if defined) is successful.


                    Possible check types:

                    - http: Perform HTTP check on the container with the specified path.

                    - tcp: Perform TCP check on the container.'
                  properties:
                    failure_threshold:
                      type: integer
                      description: 'Number of consecutive failures before considering the container as unhealthy.

                        Unhealthy containers do not receive traffic from incoming requests.'
                      format: uint32
                    interval:
                      type: string
                      description: Time interval between checks. (in seconds)
                      example: 2.5s
                      nullable: true
                    timeout:
                      type: string
                      description: Duration before the check times out. (in seconds)
                      example: 2.5s
                      nullable: true
                    tcp:
                      type: object
                      description: 'Perform TCP check on the container.

                        The check is successful if a TCP connection can be established with the container within the specified timeout.'
                      nullable: true
                      x-one-of: probe
                    http:
                      type: object
                      description: 'Perform HTTP check on the container.

                        The check is successful if an HTTP request to the specified path returns a successful status code (e.g. 2XX or 3XX) within the specified timeout.'
                      properties:
                        path:
                          type: string
                          description: HTTP path to perform the check on.
                      nullable: true
                      x-properties-order:
                      - path
                      x-one-of: probe
                  x-properties-order:
                  - failure_threshold
                  - interval
                  - timeout
                  - tcp
                  - http
                startup_probe:
                  type: object
                  description: 'Defines how to check if the container has started successfully.

                    If the startup probe fails, the container will be restarted.

                    This check is useful for applications that might take a long time to start. It is only performed when the container is starting.


                    Possible check types:

                    - http: Perform HTTP check on the container with the specified path.

                    - tcp: Perform TCP check on the container.'
                  properties:
                    failure_threshold:
                      type: integer
                      format: uint32
                    interval:
                      type: string
                      description: (in seconds)
                      example: 2.5s
                      nullable: true
                    timeout:
                      type: string
                      description: (in seconds)
                      example: 2.5s
                      nullable: true
                    http:
                      type: object
                      properties:
                        path:
                          type: string
                      nullable: true
                      x-properties-order:
                      - path
                      x-one-of: probe
                    tcp:
                      type: object
                      nullable: true
                      x-one-of: probe
                  x-properties-order:
                  - failure_threshold
                  - interval
                  - timeout
                  - http
                  - tcp
                tags:
                  type: array
                  description: Tags of the Serverless Container.
                  nullable: true
                  items:
                    type: string
                private_network_id:
                  type: string
                  description: 'ID of the Private Network the container is connected to.

                    When connected to a Private Network, the container can access other Scaleway resources in this Private Network.'
                command:
                  type: array
                  description: 'Container command.

                    Command executed when the container starts. This overrides the default command defined in the container image. This is usually the main executable, or ENTRYPOINT script to run.'
                  nullable: true
                  items:
                    type: string
                args:
                  type: array
                  description: 'Container arguments.

                    Arguments passed to the command specified in the "command" field. These override the default arguments from the container image, and behave like command-line parameters.'
                  nullable: true
                  items:
                    type: string
              x-properties-order:
              - environment_variables
              - secret_environment_variables
              - min_scale
              - max_scale
              - memory_limit_bytes
              - mvcpu_limit
              - timeout
              - privacy
              - description
              - image
              - protocol
              - port
              - https_connection_only
              - sandbox
              - local_storage_limit_bytes
              - scaling_option
              - liveness_probe
              - startup_probe
              - tags
              - private_network_id
              - command
              - args
      security:
      - scaleway: []
      x-codeSamples:
      - lang: cURL
        source: "curl -X PATCH \\\n  -H \"X-Auth-Token: $SCW_SECRET_KEY\" \\\n  -H \"Content-Type: application/json\" \\\n  -d '{}' \\\n  \"https://api.scaleway.com/containers/v1/regions/{region}/containers/{container_id}\""
      - lang: HTTPie
        source: "http PATCH \"https://api.scaleway.com/containers/v1/regions/{region}/containers/{container_id}\" \\\n  X-Auth-Token:$SCW_SECRET_KEY"
    delete:
      tags:
      - Containers
      operationId: DeleteContainer
      summary: Delete the container associated with the specified ID
      description: 'It also deletes in cascade any resource linked to the container (crons, tokens, etc.).


        This action **cannot** be undone.'
      parameters:
      - in: path
        name: region
        description: The region you want to target
        required: true
        schema:
          type: string
          enum:
          - fr-par
          - nl-ams
          - pl-waw
      - in: path
        name: container_id
        description: UUID of the container to delete.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/scaleway.containers.v1.Container'
      security:
      - scaleway: []
      x-codeSamples:
      - lang: cURL
        source: "curl -X DELETE \\\n  -H \"X-Auth-Token: $SCW_SECRET_KEY\" \\\n  \"https://api.scaleway.com/containers/v1/regions/{region}/containers/{container_id}\""
      - lang: HTTPie
        source: "http DELETE \"https://api.scaleway.com/containers/v1/regions/{region}/containers/{container_id}\" \\\n  X-Auth-Token:$SCW_SECRET_KEY"
  /containers/v1/regions/{region}/containers/{container_id}/redeploy:
    post:
      tags:
      - Containers
      operationId: RedeployContainer
      summary: Redeploy a container
      description: 'Performs a rollout of the container by creating new instances with the latest image version and terminating the old instances.

        When using mutable registry image references (e.g. `my-registry-namespace/image:tag`), this endpoint can be used to force the container to use

        the most recent image version available in the registry.'
      parameters:
      - in: path
        name: region
        description: The region you want to target
        required: true
        schema:
          type: string
          enum:
          - fr-par
          - nl-ams
          - pl-waw
      - in: path
        name: container_id
        description: ID of the container to redeploy.
        required: true
        schema:
          type: string
