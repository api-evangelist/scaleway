      - lang: HTTPie
        source: "http POST \"https://api.scaleway.com/iam/v1alpha1/users/{user_id}/update-password\" \\\n  X-Auth-Token:$SCW_SECRET_KEY \\\n  password=\"string\""
    servers:
    - url: https://api.scaleway.com
  /iam/v1alpha1/users/{user_id}/update-username:
